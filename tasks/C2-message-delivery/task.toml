id = "C2-message-delivery"
version = "1.0.0"
track = "C"
model = "claude"
mode = "local"
thread = "new"
prompt = "prompt.md"
time_cap_s = 900
grade_groups = ["W1-limiter", "W1-api", "C2-F1", "C2-F2", "C2-F3"]
chat_lock_probe = true

[[followup]]
id = "C2-F1"
at_s = 30
file = "followups/F1.md"

[[followup]]
id = "C2-F2"
at_s = 90
file = "followups/F2.md"

[[followup]]
id = "C2-F3"
at_s = 150
file = "followups/F3.md"

[followup_policy]
refused_retry_every_s = 1
refused_give_up_s = 10
