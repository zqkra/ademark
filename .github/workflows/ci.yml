# Runs the harness tests on macOS and builds the site, on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Harness tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Build the native helper
        run: bash bench/native/build.sh
      - name: Run the tests
        working-directory: bench
        run: bun test

  site:
    name: Site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: site
        run: bun run build
